service: gratulo
image: florianmoesch/gratulo

servers:
  web:
    hosts:
      - gratulo.radtreffcampus.de
    proxy: false
    labels:
      traefik.enable: "true"
      traefik.docker.network: proxy
      traefik.http.routers.to-gratulo.rule: Host(`gratulo.radtreffcampus.de`)
      traefik.http.routers.to-gratulo.tls: "true"
      traefik.http.routers.to-gratulo.entrypoints: https
      traefik.http.routers.to-gratulo.tls.certresolver: le
    options:
      # Wir nutzen hier die "Option-als-Key" Schreibweise.
      # Das ist ein valider Hash, den Kamal akzeptiert:
      network: "proxy"
      # Für das zweite Netzwerk tricksen wir ein bisschen,
      # damit der Key im Hash eindeutig bleibt:
      "network ": "congratulatory-emailer_internal"

registry:
  username: florianmoesch
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  secret:
    - APP_SECRET
    - SERVICE_USER_NAME
    - SERVICE_USER_PASSWORD
    - JWT_SECRET_KEY

  clear:
    INITIAL_ADMIN_USER: "bla@bla.com"
    INITIAL_PASSWORD: ""
    JWT_ALGORITHM: "HS256"
    HTTPS_ONLY: "true"
    # CSP zunächst nur im Report-Only-Modus (Verstöße werden geloggt, nichts
    # blockiert). Auf "false" setzen, um die Policy scharf zu schalten.
    CSP_REPORT_ONLY: "true"
    BASE_URL: "https://gratulo.radtreffcampus.de"
    CLUB_FOUNDATION_DATE: "2009-01-01"
    SESSION_LIFETIME: "480"
    ENABLE_REST_API: "False"
    JWT_EXPIRE_MINUTES: "60"
    LOG_LEVEL: "INFO"
    REDIS_URL: "redis://congratulatory-emailer-redis-1:6379/0"
    PORT: 8000

builder:
  arch: amd64

ssh:
  user: guideapp

volumes:
  - "congratulatory-emailer_gratulo_data:/app/app/data"
  - "gratulo_frontend_images:/app/frontend/static/images"